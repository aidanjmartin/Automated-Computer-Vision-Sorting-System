<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shape Sorter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #fff;
            padding: 20px;
            min-height: 100vh;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 0 20px;
        }

        h1 {
            font-size: 3em;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .controls {
            display: flex;
            gap: 15px;
        }

        .btn {
            padding: 15px 40px;
            font-size: 1.2em;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-start {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: #1e3c72;
        }

        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(79, 172, 254, 0.4);
        }

        .btn-stop {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .btn-stop:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            text-align: center;
            margin-bottom: 30px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 10px;
            animation: pulse 2s infinite;
        }

        .status-stopped {
            background: #ff4757;
        }

        .status-running {
            background: #2ed573;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .panel {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
        }

        .panel-title {
            font-size: 1.3em;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .close-btn {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1.5em;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.3s;
        }

        .close-btn:hover {
            opacity: 1;
        }

        .video-container {
            background: #000;
            border-radius: 10px;
            aspect-ratio: 4/3;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            text-align: center;
        }

        .video-placeholder {
            color: #666;
        }

        .camera-icon {
            font-size: 4em;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .shapes-preview {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 15px;
            font-size: 3em;
            opacity: 0.3;
        }

        .log-panel {
            grid-column: 1 / -1;
        }

        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .clear-btn {
            padding: 8px 20px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 20px;
            color: #fff;
            cursor: pointer;
            transition: background 0.3s;
        }

        .clear-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .log-content {
            background: #000;
            border-radius: 10px;
            padding: 20px;
            font-family: 'Courier New', monospace;
            font-size: 0.95em;
            height: 200px;
            overflow-y: auto;
            color: #0f0;
        }

        .log-entry {
            margin-bottom: 5px;
            opacity: 0;
            animation: fadeIn 0.3s forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .log-content::-webkit-scrollbar {
            width: 8px;
        }

        .log-content::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .log-content::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
        }

        @media (max-width: 1024px) {
            .content {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Shape Sorter</h1>
        <div class="controls">
            <button class="btn btn-start" id="startBtn" onclick="startSystem()">Start</button>
            <button class="btn btn-stop" id="stopBtn" onclick="stopSystem()" disabled>Stop</button>
        </div>
    </div>

    <div class="status">
        <span class="status-indicator status-stopped" id="statusIndicator"></span>
        <strong>Status: <span id="statusText">STOPPED</span></strong>
    </div>

    <div class="content">
        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">
                    📷 Original Image
                </div>
                <button class="close-btn">×</button>
            </div>
            <div class="video-container" id="originalVideo">
                <div class="camera-icon">📷</div>
                <div class="video-placeholder">
                    <div style="font-size: 1.2em; margin-bottom: 10px;">Original image will appear here</div>
                    <div style="font-size: 0.9em;">Connect to backend video stream</div>
                </div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">
                    📷 Edge Detection
                </div>
                <button class="close-btn">×</button>
            </div>
            <div class="video-container" id="edgeVideo">
                <div class="shapes-preview">
                    <span>○</span>
                    <span>□</span>
                    <span>△</span>
                </div>
                <div class="video-placeholder">
                    <div style="font-size: 1.2em; margin-bottom: 10px;">Edge detection output</div>
                    <div style="font-size: 0.9em;">Processed shapes will appear here</div>
                </div>
            </div>
        </div>

        <div class="panel log-panel">
            <div class="log-header">
                <div class="panel-title">
                    📋 System Log
                </div>
                <button class="clear-btn" onclick="clearLog()">Clear</button>
            </div>
            <div class="log-content" id="logContent">
                <div class="log-entry">System ready. Press START to begin...</div>
            </div>
        </div>
    </div>

    <script>
        let isRunning = false;
        let logCounter = 0;

        function addLog(message) {
            const logContent = document.getElementById('logContent');
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.className = 'log-entry';
            logEntry.textContent = `[${timestamp}] ${message}`;
            logContent.appendChild(logEntry);
            logContent.scrollTop = logContent.scrollHeight;
        }

        function startSystem() {
            isRunning = true;
            document.getElementById('startBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
            document.getElementById('statusText').textContent = 'RUNNING';
            document.getElementById('statusIndicator').className = 'status-indicator status-running';
            
            addLog('System started');
            addLog('Initializing camera connection...');
            addLog('Connecting to backend...');
            
            // Simulate backend connection
            setTimeout(() => {
                addLog('Backend connected successfully');
                addLog('Computer vision module initialized');
                addLog('Servo control ready');
                addLog('Waiting for shapes...');
            }, 1500);
        }

        function stopSystem() {
            isRunning = false;
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            document.getElementById('statusText').textContent = 'STOPPED';
            document.getElementById('statusIndicator').className = 'status-indicator status-stopped';
            
            addLog('System stopped');
            addLog('Disconnecting from backend...');
        }

        function clearLog() {
            const logContent = document.getElementById('logContent');
            logContent.innerHTML = '<div class="log-entry">Log cleared. System ready.</div>';
        }

        // Example function to simulate shape detection (for testing)
        function simulateShapeDetection(shape) {
            if (isRunning) {
                addLog(`Shape detected: ${shape}`);
                addLog(`Servo activated - sorting ${shape}`);
            }
        }

        // You can call this to test: simulateShapeDetection('Circle')
    </script>
</body>
</html>
